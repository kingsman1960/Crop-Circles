# What each crop needs, for crops that grow well in southern Germany (Baden-Württemberg, Bavaria). Feeds the
# crop-plan visualizer; crops.toml stays the rotation model. Ids that also exist in crops.toml are the same crop.
#
# Units are chosen so that every number can be held against a field in data/processed/fields.geojson:
#   ph, ph_limits   soil pH in water, 0–30 cm – the same as the field's `ph` (SoilGrids phh2o).
#                   German lab reports give pH in CaCl2, about 0.5–0.6 lower: add that before comparing.
#                   ph = optimum range, ph_limits = the crop still grows (absolute range).
#   texture         soil classes the crop does well on; a field's class comes from its sand_pct / clay_pct ([model]).
#   t_opt_c         optimum mean air temperature during growth, °C.
#   rain_opt_mm     optimum annual rainfall, mm (Kraichgau ~750 mm, Upper Rhine 650–800, Alpine foothills >1000).
#   t_germ_c        minimum soil temperature for sowing / germination, °C.
#   frost_c         plants die below about this air temperature: winter crops = hardened stand without snow,
#                   spring crops = young plants (late frost), cover crops = where they winter-kill.
#   drought         tolerance of a summer without rain: low | medium | high.
#   break_years     years before the same crop should come back (Anbaupause). Members of one `family` share
#                   pests and diseases (Brassicaceae: clubroot; Fabaceae: foot rots), so count them together.
#   sow, harvest    day of year [from, to]. Winter crops are sown in autumn of the year before. Transplanted
#                   crops: planting. Perennial fodder: harvest = first to last cut. Cover crops: no harvest.
#   thuenen         class in the Thünen crop-type map (landscape_summary.json legends), where it has one.
#   ecoport         FAO ECOCROP crop id, where the numbers come from.
#
# Sources. t_opt_c, rain_opt_mm, ph, ph_limits, texture: FAO ECOCROP (EcoCrop_DB.csv, as published by
# OpenCLIM/ecocrop) unless a comment says otherwise. sow/harvest of winter wheat, winter barley, winter rapeseed,
# sugar beet and maize: DWD phenology around Heilbronn 2001–2026 (phenology.parquet), 10th–90th percentile of the
# yearly regional median. break_years: German extension guidance (rapeseed ≥3, sunflower up to 5, flax 6–7:
# BÜL 2017 review; DLG organic rotation poster 2024). All other calendar, frost, germination and drought values
# are agronomic estimates for the lowlands – screening only, to check against LTZ Augustenberg / LfL Bayern.

[model]
ref_elev_m = 200       # sow/harvest are for the Kraichgau and Upper Rhine lowlands
days_per_100m = 3      # Hopkins' bioclimatic law (~4 days per 400 ft): higher up, spring dates come later
heavy_clay_pct = 35    # field texture class: clay ≥ 35 % = heavy (clays, heavy clay loams) …
light_sand_pct = 50    # … else sand ≥ 50 % = light (sands, loamy sands), else medium (loams, silt loams, loess)

