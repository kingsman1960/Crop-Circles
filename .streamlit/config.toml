# Crop Circles theme. The font ships with the app (app/static/Archivo.ttf), so the demo also works offline.
[server]
enableStaticServing = true
runOnSave = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2E6A4E"              # hedge green: actions, and what helps
backgroundColor = "#FBFAF6"           # chalk: the page
secondaryBackgroundColor = "#F1EEE4"  # inputs, wells
textColor = "#22302A"                 # furrow ink
linkColor = "#2E6A4E"
linkUnderline = false
borderColor = "#DEDACD"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "full"
font = "Archivo, sans-serif"
headingFont = "Archivo, sans-serif"
baseFontSize = 17
headingFontWeights = [800, 700, 650, 650, 600, 600]
headingFontSizes = ["2.75rem", "2rem", "1.4rem", "1.15rem"]
metricValueFontWeight = 700
redColor = "#A8336A"
greenColor = "#2E6A4E"
yellowColor = "#B88A1E"
orangeColor = "#8A6514"
chartCategoricalColors = ["#2E6A4E", "#A8336A", "#D6A93C", "#22302A", "#8E9688", "#6B8FA3"]

[[theme.fontFaces]]
family = "Archivo"
url = "app/static/Archivo.ttf"
weight = "100 900"
style = "normal"