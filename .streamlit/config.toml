# Field journal: for farmers, not analysts. Calm sage page (Wise DESIGN.md), editorial serif titles (Claude DESIGN.md),
# colours from the Crop Circles logo – green for actions, magenta only for the planthopper, navy ink.
[theme]
base = "light"
primaryColor = "#2f6a3f"
backgroundColor = "#f1f4ee"
secondaryBackgroundColor = "#e6ebe2"
textColor = "#16213e"
linkColor = "#2f6a3f"
linkUnderline = true
borderColor = "#d9e0d4"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "full"
baseFontSize = 16
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Newsreader:https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
headingFontSizes = ["40px", "28px", "24px", "18px", "16px", "16px"]
headingFontWeights = [500, 500, 500, 500, 500, 500]
metricValueFontSize = "28px"
metricValueFontWeight = 500
chartCategoricalColors = ["#16213e", "#b03a72", "#8a94a6", "#c3cad4", "#2f6a3f"]
greenColor = "#2f6a3f"
redColor = "#b03a72"
orangeColor = "#9a6a12"

[server]
runOnSave = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
