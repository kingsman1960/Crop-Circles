<svg class="cc-hero-map" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cc-hero-t cc-hero-d">
<title id="cc-hero-t">Strip fields with flight rings</title>
<desc id="cc-hero-d">Three farms, each with a dashed ring of about one kilometre. Beet strips in magenta, wheat after beet in gold, switched strips in green. The rings overlap, so the farms share planthoppers.</desc>
