<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- deck.gl, the engine behind pydeck, so the map looks and moves like the other maps.
     For an offline demo: download this file next to index.html and point src at it. -->
<script src="https://unpkg.com/deck.gl@9.1/dist.min.js"></script>
<style>
  /* Crop Circles: same type and story colours as the app (assets/tokens.css). Solid = yours, dashed = neighbours. */
  @font-face { font-family: "Archivo"; src: url("/app/static/Archivo.ttf") format("truetype");
               font-weight: 100 900; font-stretch: 62% 125%; font-display: swap; }
  :root { --accent: #2E6A4E; --text: #22302A; --quiet: #5A6258; --line: #DEDACD; --bg: #ffffff;
          --beet: #A8336A; --hedge: #2E6A4E; --loess: #D6A93C; --font: "Archivo", system-ui, sans-serif; }
  html, body { margin: 0; padding: 0; font-family: var(--font); color: var(--text); background: transparent; }
  #wrap { position: relative; border-radius: 14px; overflow: hidden; }
  #map { position: relative; width: 100%; }
  #bar { position: absolute; top: 12px; left: 12px; z-index: 4; display: flex; gap: 6px; align-items: center;
         flex-wrap: wrap; max-width: calc(100% - 24px); }
  button { font: inherit; font-size: 15px; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer;
           border: 1px solid var(--line); background: var(--bg); color: var(--text);
           box-shadow: 0 1px 2px rgba(34, 48, 42, .18); display: inline-flex; align-items: center; gap: 6px; }
  button:hover:not(:disabled) { border-color: var(--text); }
  button:focus-visible { outline: 3px solid var(--loess); outline-offset: 2px; }
  button.on { background: var(--text); color: #fff; border-color: var(--text); }
  button:disabled { opacity: .45; cursor: default; }
  .sep { width: 1px; height: 24px; background: rgba(34, 48, 42, .2); margin: 0 2px; }
  #crop-wrap { position: relative; }
  #b-crop.on { background: #fff; color: var(--text); border: 2px solid var(--text); padding: 5px 13px; }
  #menu { position: absolute; top: 42px; left: 0; z-index: 5; display: none; min-width: 240px; background: #fff;
          border-radius: 14px; border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(34, 48, 42, .16); padding: 4px; }
  #menu.open { display: block; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 7px 9px; border-radius: 10px; cursor: pointer; font-size: 15px; }
  .opt:hover, .opt.cur { background: #F1EEE4; }
  .opt small { display: block; color: var(--quiet); font-size: 13px; }
  .opt svg { flex: none; }
  #hint { position: absolute; bottom: 22px; left: 12px; z-index: 2; font-size: 14px; line-height: 1.45; padding: 7px 11px;
          border-radius: 10px; background: rgba(255, 255, 255, .94); border: 1px solid var(--line); max-width: calc(100% - 24px); }
  #hint i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin: 0 4px -1px 10px; }
  #toast { position: absolute; top: 56px; left: 12px; z-index: 3; font-size: 15px; padding: 7px 12px;
           border-radius: 10px; background: var(--text); color: #fff; display: none; max-width: calc(100% - 24px); }
  #credit { position: absolute; bottom: 0; right: 0; z-index: 2; font-size: 11px; padding: 1px 6px;
            background: rgba(255, 255, 255, .85); color: var(--quiet); }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"></div>
  <div id="bar">
    <button id="b-select" class="on"></button>
    <button id="b-cut"></button>
    <button id="b-merge" disabled></button>
    <button id="b-undo" disabled></button>
    <span class="sep" id="crop-sep" style="display:none"></span>
    <span id="crop-wrap" style="display:none">
      <button id="b-crop"></button>
      <div id="menu"></div>
    </span>
    <button id="b-finish" style="display:none"></button>
  </div>
  <div id="toast"></div>
  <div id="hint"></div>
  <div id="credit"></div>
</div>
<script>
// --- talking to Streamlit (the protocol streamlit-component-lib uses, without a build step) ---------------------
const Streamlit = {
  send(type, data) { window.parent.postMessage({isStreamlitMessage: true, type, ...data}, "*"); },
  ready() { this.send("streamlit:componentReady", {apiVersion: 1}); },
  height(h) { this.send("streamlit:setFrameHeight", {height: h}); },
  value(v) { this.send("streamlit:setComponentValue", {value: v, dataType: "json"}); },
};

const $ = id => document.getElementById(id);
let args = null, deckgl = null, mode = "select", busy = false, paintCrop = null;
let selected = new Set(), cutPts = [], hoverPt = null, revision = -1, toastTimer = null;
const pending = new Map();  // plots painted here that Python has not confirmed yet: id -> crop key or null
let accent = [46, 106, 78];  // hedge green until Streamlit's theme arrives

// how well a crop fits a plot: magenta = poor fit (the same colour as planthopper pressure), gold = careful, green = good
const TONE = {bad: [168, 51, 106, 210], warn: [214, 169, 60, 190], ok: [250, 250, 250, 160],
              good: [46, 106, 78, 190], unknown: [175, 178, 168, 130]};

let basemap = null;  // built from the first render: Python decides which tiles (see _basemap)
function makeBasemap(b) {
  return new deck.TileLayer({
    id: "basemap", data: b.tiles, minZoom: 0, maxZoom: b.max_zoom || 19, tileSize: 256,
    renderSubLayers: props => {
      const [[w, s], [e, n]] = props.tile.boundingBox;
      return new deck.BitmapLayer(props, {data: null, image: props.data, bounds: [w, s, e, n]});
    },
  });
}

// --- small helpers ------------------------------------------------------------------------------------------------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const fill = (template, props) => template.replace(/\{(\w+)\}/g, (_, k) => (props[k] ?? ""));
const crop = key => (args.palette || []).find(c => c.key === key);
const planOf = p => pending.has(p.id) ? pending.get(p.id) : (p.plan || null);

function hexToRgb(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
  return m ? [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16)) : null;
}

function send(payload) {
  Streamlit.value({...payload, nonce: `${Date.now()}-${Math.random().toString(36).slice(2)}`});
}

// simple drawn icons, one per crop key (anything else gets a dot)
function icon(key, size = 22) {
  const c = crop(key), col = c ? css(c.rgb) : "#999", leaf = "#5c9a3c";
  const shapes = {
    potato: `<ellipse cx="12" cy="13" rx="9" ry="6.5" fill="${col}"/><circle cx="8.5" cy="11" r="1" fill="#0005"/>
             <circle cx="14" cy="15" r="1" fill="#0005"/><circle cx="16" cy="10.5" r="0.9" fill="#0005"/>`,
    wheat: `<path d="M12 22V6" stroke="${col}" stroke-width="1.6"/>` +
           [7, 11, 15].map(y => `<ellipse cx="9.6" cy="${y}" rx="2.2" ry="1.3" transform="rotate(-35 9.6 ${y})" fill="${col}"/>
             <ellipse cx="14.4" cy="${y}" rx="2.2" ry="1.3" transform="rotate(35 14.4 ${y})" fill="${col}"/>`).join("") +
           `<ellipse cx="12" cy="4" rx="1.3" ry="2" fill="${col}"/>`,
    barley: `<path d="M12 22V7" stroke="${col}" stroke-width="1.6"/>` +
            [8, 11.5, 15].map(y => `<ellipse cx="10" cy="${y}" rx="2" ry="1.2" transform="rotate(-35 10 ${y})" fill="${col}"/>
              <ellipse cx="14" cy="${y}" rx="2" ry="1.2" transform="rotate(35 14 ${y})" fill="${col}"/>
              <path d="M9 ${y - 1}L5 ${y - 6}M15 ${y - 1}L19 ${y - 6}" stroke="${col}" stroke-width=".8"/>`).join(""),
    maize: `<path d="M7 21C6 14 8 9 12 7C9 12 9 17 10 21Z" fill="${leaf}"/>
            <ellipse cx="13.5" cy="12" rx="3.6" ry="8" fill="${col}"/>
            <path d="M11.5 7v10M13.5 5v14M15.5 7v10" stroke="#fff6" stroke-width=".8"/>`,
    pea: `<path d="M3 15C6 8 16 6 21 9C18 15 9 18 3 15Z" fill="${col}"/>` +
         [8, 12, 16].map(x => `<circle cx="${x}" cy="${12.5 - (x - 8) * 0.2}" r="1.9" fill="#ffffff8c"/>`).join(""),
    beet: `<path d="M10 9C6 3 4 3 4 3C5 6 7 8 10 9ZM14 9C18 3 20 3 20 3C19 6 17 8 14 9Z" fill="${leaf}"/>
           <path d="M12 23C9 18 6.5 14 7.5 11.5C8.5 9 15.5 9 16.5 11.5C17.5 14 15 18 12 23Z" fill="${col}"/>`,
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24">${shapes[key] || `<circle cx="12" cy="12" r="6" fill="${col}"/>`}</svg>`;
}

// --- the crop drop-down ---------------------------------------------------------------------------------------------
function buildMenu() {
  const L = args.labels, m = $("menu");
  m.innerHTML = `<div class="opt" data-key=""><svg width="22" height="22"></svg><div>${esc(L.no_crop)}</div></div>` +
    (args.palette || []).map(c => `<div class="opt" data-key="${esc(c.key)}">${icon(c.key)}
      <div>${esc(c.label)}${c.family ? `<small>${esc(c.family)}</small>` : ""}</div></div>`).join("");
  m.querySelectorAll(".opt").forEach(el => el.onclick = e => {
    e.stopPropagation();
    $("menu").classList.remove("open");
    const key = el.dataset.key || null;
    paintCrop = key;
    setMode(key ? "paint" : "select");
  });
}

// --- what happens on the map --------------------------------------------------------------------------------------
function onClick(info, event) {
  $("menu").classList.remove("open");
  if (busy) return;
  if (mode === "cut") {
    if (info.coordinate) { cutPts.push(info.coordinate); draw(); }
    return;
  }
  const p = info.object && info.layer && info.layer.id === "plots" ? info.object.properties : null;  // neighbours are not editable
  if (mode === "paint") {
    if (!p) return;
    pending.set(p.id, planOf(p) === paintCrop ? null : paintCrop);  // clicking again takes the plan away
    send({action: "paint", plans: Object.fromEntries(pending)});    // all unconfirmed paints, so fast clicks survive
    draw();
    return;
  }
  const e = event && event.srcEvent;
  const add = e && (e.shiftKey || e.metaKey || e.ctrlKey);
  const id = p ? p.id : null;
  if (!id) { if (!add) selected.clear(); }
  else if (add) { selected.has(id) ? selected.delete(id) : selected.add(id); }
  else { selected = new Set([id]); }
  draw();
  if (args.report_selection) send({action: "select", ids: [...selected]});
}

function finishCut() {
  // a double-click also fires two clicks on the same spot: drop the repeats
  const pts = cutPts.filter((p, i) => i === 0 || Math.hypot(p[0] - cutPts[i - 1][0], p[1] - cutPts[i - 1][1]) > 1e-7);
  cutPts = []; hoverPt = null;
  if (pts.length >= 2) { busy = true; send({action: "cut", line: pts}); }
  draw();
}

function setMode(m) {
  mode = m; cutPts = []; hoverPt = null;
  if (m !== "paint") paintCrop = null;
  if (m !== "select") selected.clear();
  draw();
}

// --- drawing ------------------------------------------------------------------------------------------------------
function plotColor(f) {
  const p = f.properties;
  if (mode === "paint" && paintCrop) {
    const level = (p.fit && p.fit[paintCrop] && p.fit[paintCrop].level) || "unknown";
    return TONE[level] || TONE.unknown;
  }
  const plan = planOf(p);
  if (plan && crop(plan)) return [...crop(plan).rgb, 240];               // planned: solid
  const c = p.rgb || [200, 200, 200];
  return (args.palette || []).length ? [c[0], c[1], c[2], 110] : (c.length === 4 ? c : [...c, 235]);  // last year: faded
}

// neighbours: faded fill, dashed outline; nurseries with a solid accent outline; the flight-range ring dashed
const DASH = deck.PathStyleExtension ? [new deck.PathStyleExtension({dash: true})] : [];
let contextCache = null;
function contextLayers() {
  const ctx = args.context || [];
  if (!ctx.length) return [];
  const sig = `${ctx.length}:${ctx[0].properties.id}:${ctx[ctx.length - 1].properties.id}`;
  if (contextCache && contextCache.sig === sig) return contextCache.layers;  // same neighbours: keep the built layers
  const fc = list => ({type: "FeatureCollection", features: list});
  const kind = k => ctx.filter(f => f.properties.kind === k);
  const parcels = kind("context"), shared = kind("collab");
  const hue = args.accent_hue || [168, 51, 106];
  const built = [
    // neighbours from the crop maps: faded, dashed
    new deck.GeoJsonLayer({
      id: "context", data: fc(parcels), pickable: true, filled: true, stroked: true,
      getFillColor: f => [...(f.properties.rgb || [195, 202, 212]), 70],
      getLineColor: [34, 48, 42, 120], lineWidthMinPixels: 1,
      extensions: DASH, getDashArray: [3, 2], dashJustified: true,
    }),
    // likely nurseries (last season's beet): dashed in the planthopper colour
    new deck.GeoJsonLayer({
      id: "context-likely", data: fc(parcels.filter(f => f.properties.role === "likely")), filled: false,
      stroked: true, getLineColor: [...hue, 230], lineWidthMinPixels: 2,
      extensions: DASH, getDashArray: [4, 2], dashJustified: true,
    }),
    // other farmers' saved plans: real outlines, their crops, solid
    new deck.GeoJsonLayer({
      id: "context-shared", data: fc(shared), pickable: true, filled: true, stroked: true,
      getFillColor: f => [...(f.properties.rgb || [195, 202, 212]), 165],
      getLineColor: [34, 48, 42, 210], lineWidthMinPixels: 1.5,
    }),
    // confirmed nurseries in shared plans: solid planthopper colour
    new deck.GeoJsonLayer({
      id: "context-nurseries", data: fc(shared.filter(f => f.properties.role === "nursery")), filled: false,
      stroked: true, getLineColor: [...hue, 240], lineWidthMinPixels: 3,
    }),
    new deck.GeoJsonLayer({
      id: "context-ring", data: fc(kind("ring")), filled: false, stroked: true,
      getLineColor: [34, 48, 42, 170], lineWidthMinPixels: 1.5,
      extensions: DASH, getDashArray: [6, 4], dashJustified: true,
    }),
  ];
  contextCache = {sig, layers: built};
  return built;
}

function layers() {
  const feats = args.features || [];
  const fc = list => ({type: "FeatureCollection", features: list});
  const key = [revision, mode, paintCrop, [...pending.entries()].join("|")];
  const out = [...(basemap ? [basemap] : []), ...contextLayers()];
  out.push(
    new deck.GeoJsonLayer({
      id: "plots", data: fc(feats), pickable: true, autoHighlight: mode !== "cut",
      highlightColor: [255, 255, 255, 70], filled: true, stroked: true, getFillColor: plotColor,
      getLineColor: [255, 255, 255], lineWidthMinPixels: 1, updateTriggers: {getFillColor: key},
    }),
  );
  if (mode === "paint") {  // while painting, planned plots keep a border in their crop's colour
    const planned = feats.filter(f => planOf(f.properties) && crop(planOf(f.properties)));
    out.push(new deck.GeoJsonLayer({id: "planned", data: fc(planned), filled: false, stroked: true,
                                    getLineColor: f => [...crop(planOf(f.properties)).rgb, 255], lineWidthMinPixels: 4,
                                    updateTriggers: {getLineColor: key}}));
  }
  if (args.outline) {
    out.push(new deck.GeoJsonLayer({id: "outline", data: args.outline, filled: false, stroked: true,
                                    getLineColor: [34, 48, 42], lineWidthMinPixels: 2}));
  }
  out.push(new deck.GeoJsonLayer({
    id: "selected", data: fc(feats.filter(f => selected.has(f.properties.id))), filled: true, stroked: true,
    getFillColor: [...accent, 45], getLineColor: [...accent, 255], lineWidthMinPixels: 3,
  }));
  if (mode === "cut" && cutPts.length) {
    const path = hoverPt ? [...cutPts, hoverPt] : cutPts;
    out.push(new deck.PathLayer({id: "cutline", data: [{path}], getPath: d => d.path, getColor: [34, 48, 42],
                                 widthMinPixels: 2}));
    out.push(new deck.ScatterplotLayer({id: "cutpoints", data: cutPts, getPosition: d => d, getFillColor: [255, 255, 255],
                                        getLineColor: [34, 48, 42], stroked: true, radiusMinPixels: 4,
                                        lineWidthMinPixels: 2}));
  }
  return out;
}

function tooltip({object, layer}) {
  if (!object || !object.properties || mode === "cut") return null;
  if (layer && layer.id !== "plots") {  // a neighbour: its own text, written by Python
    return object.properties.tip ? {html: object.properties.tip, style: {maxWidth: "330px", fontSize: "13px", lineHeight: "1.4"}} : null;
  }
  const p = object.properties, L = args.labels, parts = [];
  if ((args.palette || []).length) {
    const plan = planOf(p);
    parts.push(`<b>${esc(L.plan)}: ${plan && crop(plan) ? esc(crop(plan).label) : esc(L.not_planned)}</b> · ${esc(p.ha)} ha`);
  }
  if (mode === "paint" && paintCrop && p.fit && p.fit[paintCrop]) {
    const f = p.fit[paintCrop], tone = TONE[f.level] || TONE.unknown;
    parts.push(`<div style="margin-top:6px"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;
      background:${css(tone)};margin-right:5px"></i><b>${esc(crop(paintCrop).label)}: ${esc(L["level_" + f.level] || f.level)}</b>
      <br>${(f.why || []).map(esc).join("<br>")}</div>`);
  }
  if (p.tip) parts.push(`<div style="margin-top:6px;opacity:.85">${p.tip}</div>`);  // HTML written by Python
  else if (args.tooltip) parts.push(esc(fill(args.tooltip, p)));
  return parts.length ? {html: parts.join(""), style: {maxWidth: "330px", fontSize: "13px", lineHeight: "1.4"}} : null;
}

function draw() {
  if (!args) return;
  const L = args.labels, hasPalette = (args.palette || []).length > 0;
  const ids = new Set((args.features || []).map(f => f.properties.id));
  selected = new Set([...selected].filter(id => ids.has(id)));  // a cut or merge replaces ids

  $("b-select").textContent = L.select;
  $("b-cut").textContent = L.cut;
  $("b-merge").textContent = selected.size >= 2 ? `${L.merge} (${selected.size})` : L.merge;
  $("b-undo").textContent = L.undo;
  $("b-finish").textContent = L.finish;
  $("b-select").classList.toggle("on", mode === "select");
  $("b-cut").classList.toggle("on", mode === "cut");
  $("b-merge").disabled = busy || mode !== "select" || selected.size < 2;
  $("b-undo").disabled = busy || !args.can_undo;
  $("b-finish").style.display = mode === "cut" && cutPts.length >= 2 ? "" : "none";
  $("crop-wrap").style.display = $("crop-sep").style.display = hasPalette ? "" : "none";
  if (hasPalette) {
    $("b-crop").innerHTML = paintCrop && crop(paintCrop) ? `${icon(paintCrop, 18)}${esc(crop(paintCrop).label)} ▾`
                                                         : `${esc(L.crop)} ▾`;
    $("b-crop").classList.toggle("on", mode === "paint");
    $("menu").querySelectorAll(".opt").forEach(el => el.classList.toggle("cur", (el.dataset.key || null) === paintCrop));
  }
  if (busy) $("hint").textContent = L.working;
  else if (mode === "paint") {
    $("hint").innerHTML = `${esc(L.hint_paint)}<br><i style="background:${css(TONE.bad)}"></i>${esc(L.level_bad)}
      <i style="background:${css(TONE.warn)}"></i>${esc(L.level_warn)}<i style="background:${css(TONE.good)}"></i>${esc(L.level_good)}`;
  } else $("hint").textContent = mode === "cut" ? L.hint_cut : L.hint_select;
  if (deckgl) deckgl.setProps({layers: layers()});
}

function startView(el) {
  if (args.view) return {latitude: args.view.lat, longitude: args.view.lon, zoom: args.view.zoom ?? 14.4};
  const xs = [], ys = [];
  const walk = c => typeof c[0] === "number" ? (xs.push(c[0]), ys.push(c[1])) : c.forEach(walk);
  (args.features || []).forEach(f => walk(f.geometry.coordinates));
  if (!xs.length) return {latitude: 49.14, longitude: 8.91, zoom: 12};
  const vp = new deck.WebMercatorViewport({width: el.clientWidth || 700, height: args.height});
  const {latitude, longitude, zoom} = vp.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]],
                                                   {padding: 40});
  return {latitude, longitude, zoom};
}

function showToast(text) {
  const t = $("toast");
  t.textContent = text; t.style.display = "block";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = "none"; }, 5000);
}

// --- a new render from Python -------------------------------------------------------------------------------------
function onRender(data) {
  const first = !args;
  args = data.args;
  const th = data.theme;
  if (th) {
    const root = document.documentElement.style;
    if (th.primaryColor) { root.setProperty("--accent", th.primaryColor); accent = hexToRgb(th.primaryColor) || accent; }
    if (th.textColor) root.setProperty("--text", th.textColor);
    if (th.font) root.setProperty("--font", th.font);
  }
  const el = $("map");
  el.style.height = `${args.height}px`;
  if (!basemap && args.basemap) {
    basemap = makeBasemap(args.basemap);
    $("credit").textContent = args.basemap.credit;
  }
  if (first) buildMenu();
  for (const f of args.features || []) {  // paints Python now knows about are no longer pending
    const id = f.properties.id;
    if (pending.has(id) && (f.properties.plan || null) === pending.get(id)) pending.delete(id);
  }
  if (args.revision !== revision) {  // Python changed the plots: take its selection, show its message
    revision = args.revision;
    busy = false;
    if (mode === "select") selected = new Set(args.selected || []);
    if (args.message) showToast(args.message);
  }
  if (!deckgl) {
    deckgl = new deck.Deck({
      parent: el, initialViewState: startView(el), controller: {doubleClickZoom: false}, layers: [], onClick,
      onHover: info => { if (mode === "cut" && cutPts.length) { hoverPt = info.coordinate || null; draw(); } },
      getCursor: ({isDragging, isHovering}) => mode === "cut" ? "crosshair" : isDragging ? "grabbing"
        : isHovering ? (mode === "paint" ? "copy" : "pointer") : "grab",
      getTooltip: tooltip,
    });
  }
  draw();
  Streamlit.height(args.height);
}

window.addEventListener("message", e => { if (e.data && e.data.type === "streamlit:render") onRender(e.data); });
$("b-select").onclick = () => setMode("select");
$("b-cut").onclick = () => setMode("cut");
$("b-merge").onclick = () => { busy = true; send({action: "merge", ids: [...selected]}); draw(); };
$("b-undo").onclick = () => { busy = true; pending.clear(); send({action: "undo"}); draw(); };
$("b-finish").onclick = finishCut;
$("b-crop").onclick = e => { e.stopPropagation(); $("menu").classList.toggle("open"); };
document.addEventListener("click", () => $("menu").classList.remove("open"));
$("map").addEventListener("dblclick", () => { if (mode === "cut") finishCut(); });
window.addEventListener("keydown", e => {
  if (e.key === "Escape") $("menu").classList.remove("open");
  if (mode === "paint" && e.key === "Escape") setMode("select");
  if (mode !== "cut") return;
  if (e.key === "Enter") finishCut();
  if (e.key === "Escape") { cutPts.length ? (cutPts = [], hoverPt = null, draw()) : setMode("select"); }
});
Streamlit.ready();
</script>
</body>
</html>
