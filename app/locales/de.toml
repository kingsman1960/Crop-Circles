**So wird gerechnet.** Jede Feldgrenze (FIONA 2022) erhält für jedes Jahr ihre Kultur aus den Thünen-Kulturartenkarten. Ein Feld mit Winterweizen auf den Rüben des Vorjahres ist der Ort, an dem die Zikade überwintert. Der Druck auf ein Rübenfeld zählt diese Felder ringsum zusammen, nähere stärker (Σ ha × e^(−Abstand / Flugweite)). Die Felder, die je Hektar den meisten Druck wegnehmen, stellen zuerst um; die Ersatzkultur ist die mit den wenigsten Nebenwirkungen auf diesem Feld. Nicht an Zählungen kranker Rüben geprüft – es gibt keine öffentlichen –, also als Vergleich lesen, nicht als Vorhersage. Die FIONA-Grenzen stammen von 2022; die Kulturartenkarte {season} ist {status}.
