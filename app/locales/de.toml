expert.title = "Experten-Einstellungen: Flugweite, zweite Karte, Methode"
expert.season = "Saison"
expert.distance = "Wie weit die Zikade fliegt"
expert.robust = "Auf 3.476 Rübenschlag-Saisons 2023–2025 verloren Rüben neben einer Kinderstube bis zum Spätsommer tatsächlich mehr Blattmasse als Rüben neben anderem Weizen (NDRE −0,03, p < 0,001), und der Rückgang passt am besten zu einer Flugweite von 250–500 m (siehe *Woher wir es wissen*). Das richtige Fünftel nimmt {a} / {b} / {c} des Drucks weg, wenn die Zikade 0,25 / 0,5 / 1 km fliegt – das Ergebnis hängt kaum von dieser Unbekannten ab. Leicht abtragbar = K-Faktor der Bodenkarte × NASADEM-Hangneigung ≥ 0,55; die Gewitterzeit kommt aus GPM IMERG, der Wasserbedarf aus NASA POWER."
expert.dlr = "**Mit einer zweiten Karte geprüft.** Die DLR-CropTypes-Karte (Sentinel-1 + 2, unabhängig erstellt) zählt {season} {ha} ha Weizen nach Rüben (Thünen: {thuenen} ha) und findet auf {conf} der Thünen-Kinderstubenfläche ebenfalls eine Kinderstube, Schlag für Schlag. Mit der DLR-Karte nimmt das richtige Fünftel {a} / {b} / {c} des Drucks weg – die Lesart hängt nicht an einer Karte."
expert.method = """
**So wird gerechnet.** Jede Feldgrenze (FIONA 2022) erhält für jedes Jahr ihre Kultur aus den Thünen-Kulturartenkarten. Ein Schlag mit Winterweizen auf den Rüben des Vorjahres ist der Ort, an dem die Zikade überwintert. Der Druck auf einen Rübenschlag zählt diese Schläge ringsum zusammen, nähere stärker (Σ ha × e^(−Abstand / Flugweite)). Die Schläge, die je Hektar den meisten Druck wegnehmen, werden in der Karte als Sender klar gekennzeichnet; „Druck erhält“ zeigt die Rüben auf der anderen Seite. Nicht an Zählungen kranker Rüben geprüft – es gibt keine öffentlichen –, also als Vergleich lesen, nicht als Vorhersage. Die FIONA-Grenzen stammen von 2022; die Kulturartenkarte {season} ist {status}.
"""
expert.preliminary = "vorläufig"
expert.final = "endgültig"

