[know]
title = "Woher wir das wissen"
sub = "Jede Zahl in dieser App stammt aus {n} öffentlichen Datensätzen – {nasa} davon von der NASA – und aus den Empfehlungen der deutschen Pflanzenschutz- und Zuckerrüben-Institute. Hier stehen die Begriffe, die Daten und die Methode."
tab.words = "Begriffe erklärt"
tab.data = "Woher die Daten kommen"
tab.method = "So wird gerechnet"
tab.literature = "Literatur"
tab.ai = "Einsatz von KI"
search = "Begriff suchen"
search_placeholder = "zum Beispiel: Wasserbilanz, NDVI, Erosion"
no_match = "Kein Begriff passt zu „{q}“."
numbers_title = "Was die Wetterzahlen bedeuten"
col.number = "Zahl"
col.meaning = "was sie ist und warum sie zählt"
col.dataset = "Datensatz"
col.years = "Jahre und Auflösung"
col.use = "wofür wir ihn nutzen, und Lizenz"
status.used = "im Einsatz"
status.pending = "kommt – wird noch berechnet"
method_note = "Für Beratung und Wissenschaft: die technischen Einzelheiten hinter den einfachen Worten auf den anderen Seiten."
ai = "Die Bewertungen sind nachvollziehbare Regeln und ein einfaches Modell – kein trainiertes Modell und keine KI zur Laufzeit. Ein KI-Programmierassistent (Claude Code) hat beim Schreiben der Datenpipeline und dieser App nach dem Plan des Teams geholfen; jede angezeigte Zahl stammt aus dem Pipeline-Code und den hier gelisteten Datensätzen. Das Protokoll liegt in `submission/si_log.md`."
method = """
- **Felder.** F1–F3 sind OpenStreetMap-Ackerblöcke aus 11–17 echten Flurstücken. Alle Werte sind Mittel über den Block.
- **Wetterzahlen** (Hitze, Frost, Trockenperioden, Starkregen, Wasserdefizit) werden je Jahr aus Tageswerten gezählt, getrennt für NASA POWER, GPM IMERG und die nächste DWD-Station mit Daten. Die Schwellen sind Ersteinschätzungen und müssen noch an regionalen Quellen geprüft werden. Die Verdunstung (ET0) folgt Hargreaves (FAO-56).
- **Anbaukalender.** Aussaat, Auflaufen, Reihenschluss und Ernte sind Mediane der DWD-Pflanzenbeobachter im Umkreis von 40 km um Heilbronn (2001–2026). Soja und Körnererbse beobachtet der DWD nicht; ihre Termine sind Literaturschätzungen.
- **Bodenbewertung.** Ein tägliches Fruchtfolgemodell gibt jedem Tag einen Wert für offenen Boden (wie der C-Faktor der ABAG) und gewichtet ihn mit Starkregentagen (≥ 20 L/m², Mai–August, GPM IMERG 2001–{last}) sowie Erodierbarkeit (K) × Hangfaktor des Feldes. Jede Möglichkeit wird mit der jetzigen Fruchtfolge auf demselben Feld verglichen.
- **Wasserbewertung.** Wasserverbrauch der Kulturen (Kulturkoeffizient × ET0, FAO-56) in den Monaten, in denen auf diesem Feld weniger Regen fällt als verdunstet, verglichen mit der jetzigen Fruchtfolge.
- **Zikade, Stickstoff, Einkommen** sind Regelbewertungen aus der Literatur, mit Hinweis und Quelle auf jeder Karte. Das Einkommen nutzt keine Preis- oder Vertragsdaten und ist immer als sehr grob markiert.
- **Rangfolge** = Σ(Ihre Gewichtung × Bewertung) / Σ(Gewichtung). Ihre Auswahl wird nicht gespeichert.
- **Region.** Jedes FIONA-Flurstück von 2022 erhält seine Kultur je Jahr 2017–2025 aus den Thünen-10-m-Karten, und die DLR-CropTypes-Karten (10 m, Sentinel-1 + 2, unabhängig erstellt) prüfen jede Kinderstube ein zweites Mal; der Druck auf ein Rübenfeld summiert die Weizen-nach-Rüben-Felder ringsum, gewichtet mit e^(−Abstand / Flugweite). Nicht an SBR-Befall geprüft.
- **Diese Saison aus dem All.** Rund um jeden Demo-Schlag liefert jedes wolkenfreie HLS-Bild (Landsat 8/9 + Sentinel-2, 30 m, ab 2019) für jedes Flurstück einen mittleren NDVI. Ein Flurstück gilt als Wintergetreide, wenn sein Median-NDVI im Februar–März mindestens 0,45 oder im April 0,55 erreicht; als Zuckerrübe, wenn nicht, wenn er im Mai unter 0,4 bleibt, vom 1. bis 20. Juni 0,5 erreicht (Rüben schließen ihre Reihen Anfang Juni, Mais und Soja erst im Juli) und zwischen Mitte September und 20. Oktober 0,45. Die Schwellen stammen aus den Anbaukalendern und wurden an den Thünen-Karten 2019–2025 auf allen drei Demo-Schlägen geprüft – eine Prüfung an wenigen Flurstücken, kein Beweis.
- **Bedeckung über Winter.** Ein Flurstück mit einer Sommerkultur gilt als über Winter bedeckt, wenn sein Median-HLS-NDVI im November–Dezember davor mindestens 0,5 erreicht (Zwischenfrucht); Stoppeln und gepflügter Boden bleiben darunter. Im Winter gibt es wenige wolkenfreie Bilder, oft eins bis drei je Flurstück.
- **Sommergrün und der Boden jetzt.** MODIS-NDVI Juni–August je Jahr seit 2001, neben den 5 Sommern mit der niedrigsten Wasserbilanz aus NASA POWER. Boden jetzt: das Mittel der letzten 14 Tage (SMAP Oberboden, POWER Wurzelraum) gegenüber denselben 14 Tagen in jedem früheren Jahr.
- **Nicht enthalten:** Ertrags- oder Gewinnprognosen, Schädlingsprognosen, Preise und Verträge, Maschinen.
"""

