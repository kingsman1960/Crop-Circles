method_note = "Für Beratung und Wissenschaft: die technischen Einzelheiten hinter den einfachen Worten auf den anderen Seiten."
evidence.title = "Der Regionstest: Rüben neben einer Kinderstube verlieren mehr Blatt"
evidence.intro = "Auf **{n} beantragten Rübenschlag-Saisons** 2023–2025 verloren Rüben im Umkreis von 50 m um ein Weizen-nach-Rüben-Feld zwischen Juni und Spätsommer mehr Blattmasse als Rüben neben anderem Weizen – in jedem Index und jeder Saison (NDRE −{x}; Saison, Juniwert und Boden konstant gehalten, p < 0,001). Der Rückgang passt am besten zu einer Flugweite von **{r} m** ({lo}–{hi} m) und ist nach etwa 200 m verschwunden. Vollständiger Bericht: `submission/planthopper_region_report.pdf`."
evidence.adjacent = "neben einer Kinderstube (< 50 m)"
evidence.control = "neben anderem Weizen"
evidence.fig1 = "Veränderung der Blattmasse Juni → Spätsommer, nach Saison und Nachbar"
evidence.fig2 = "NDRE-Veränderung nach Abstand zur nächsten Kinderstube (Saisonmittel abgezogen, 95-%-KI)"
evidence.fig3 = "Welche Flugweite passt am besten zum Rückgang? (Log-Likelihood relativ zum besten r; gestrichelt = 2 Einheiten)"
evidence.delta = "Spätsommer − Juni"
evidence.delta_adj = "NDRE, Spätsommer − Juni"
evidence.distance = "Abstand zum nächsten Weizen-nach-Rüben-Feld"
evidence.r = "Flugweite r in e^(−Abstand / r), m"
evidence.llf = "Anpassung relativ zum besten r"
evidence.unit = "Mittel je Schlag über seine reinen 30-m-Pixel; ein Wert je Schlag und Saison"
evidence.source = "HLS S30 v2.0 (NASA LP DAAC), FIONA-Anträge (MLR), BK50 und NASADEM für die Bodenterme; pipeline/planthopper_region.py"
evidence.caveat = "Ein Zusammenhang zwischen Exposition und Symptom, keine Diagnose: Trockenheit und Cercospora vergilben Rüben ebenfalls, der Zuckergehalt wurde nicht gemessen, und die Kontrollschläge liegen noch in Flugreichweite der Zikaden (das macht den Unterschied eher kleiner als größer)."
ai = "Die Bewertungen sind nachvollziehbare Regeln und ein einfaches Modell – kein trainiertes Modell. Jede angezeigte Zahl stammt aus dem Pipeline-Code und den hier gelisteten Datensätzen. Das Feld *Fragen zu diesem Feld* auf den Seiten zum Feld und zum Anbau ist ein Sprachmodell (jeder OpenAI-kompatible Dienst, standardmäßig Qwen), das nur die Zahlen der Seite in Worte fasst: Es bekommt die Seite als Faktenkarte, darf nichts rechnen, und jede Zahl in seiner Antwort, die nicht auf der Seite steht, wird unter der Antwort zum Prüfen aufgelistet. Ohne Schlüssel ist das Feld aus, sonst ändert sich nichts. Ein KI-Programmierassistent (Claude Code) hat beim Schreiben der Datenpipeline und dieser App nach dem Plan des Teams geholfen. Das Protokoll liegt in `submission/si_log.md`."
method = """
- **Felder.** F1–F3 sind OpenStreetMap-Ackerblöcke aus 11–17 echten Flurstücken. Alle Werte sind Mittel über den Block.
- **Wetterzahlen** (Hitze, Frost, Trockenperioden, Starkregen, Wasserdefizit) werden je Jahr aus Tageswerten gezählt, getrennt für NASA POWER, GPM IMERG, Copernicus ERA5-Land und die nächste DWD-Station mit Daten. Temperatur gegenüber dem Üblichen: Monatsmittel minus dem Mittel 1991–2020 desselben Monats. Die Schwellen sind Ersteinschätzungen und müssen noch an regionalen Quellen geprüft werden. Die Verdunstung (ET0) folgt Hargreaves (FAO-56).
- **Anbaukalender.** Aussaat, Auflaufen, Reihenschluss und Ernte sind Mediane der DWD-Pflanzenbeobachter im Umkreis von 40 km um Heilbronn (2001–2026). Soja und Körnererbse beobachtet der DWD nicht; ihre Termine sind Literaturschätzungen.
- **Bodenbewertung.** Ein tägliches Fruchtfolgemodell gibt jedem Tag einen Wert für offenen Boden (wie der C-Faktor der ABAG) und gewichtet ihn mit Starkregentagen (≥ 20 L/m², Mai–August, GPM IMERG 2001–{last}) sowie Erodierbarkeit (K) × Hangfaktor des Feldes. Jede Möglichkeit wird mit der jetzigen Fruchtfolge auf demselben Feld verglichen.
- **Wasserbewertung.** Wasserverbrauch der Kulturen (Kulturkoeffizient × ET0, FAO-56) in den Monaten, in denen auf diesem Feld weniger Regen fällt als verdunstet, verglichen mit der jetzigen Fruchtfolge.
- **Zikade, Stickstoff, Einkommen** sind Regelbewertungen aus der Literatur, mit Hinweis und Quelle auf jeder Karte. Das Einkommen nutzt keine Preis- oder Vertragsdaten und ist immer als sehr grob markiert.
- **Rangfolge** = Σ(Ihre Gewichtung × Bewertung) / Σ(Gewichtung). Ihre Auswahl wird nicht gespeichert.
- **Region.** Jedes FIONA-Flurstück von 2022 erhält seine Kultur je Jahr 2017–2025 aus den Thünen-10-m-Karten, und die DLR-CropTypes-Karten (10 m, Sentinel-1 + 2, unabhängig erstellt) prüfen jede Kinderstube ein zweites Mal; der Druck auf ein Rübenfeld summiert die Weizen-nach-Rüben-Felder ringsum, gewichtet mit e^(−Abstand / Flugweite). Auf Landschaftsebene geprüft, nicht an SBR-Befall: Auf 3.476 beantragten Rübenschlag-Saisons 2023–2025 (HLS S30, `pipeline/planthopper_region.py`) verloren Rüben im Umkreis von 50 m um eine Kinderstube von Juni bis Spätsommer mehr Blattmasse als Rüben neben anderem Weizen (NDRE −0,03, NDVI −0,035; Saison, Juniwert und Boden konstant gehalten; Standardfehler nach 2-km-Zellen geclustert, p < 0,001; gleiches Vorzeichen in jedem Index und jeder Saison). Eine Abklingkurve setzt die beste Flugweite bei 250–500 m. Das ist ein Zusammenhang zwischen Exposition und Symptom: Trockenheit und Cercospora vergilben Rüben ebenfalls, und der Zuckerverlust wurde nicht gemessen.
- **Diese Saison aus dem All.** Rund um jeden Demo-Schlag liefert jedes wolkenfreie HLS-Bild (Landsat 8/9 + Sentinel-2, 30 m, ab 2019) für jedes Flurstück einen mittleren NDVI. Seine Monatsmediane Februar–Oktober, der NDVI im November–Dezember davor und die Vorfrucht gehen in eine multinomiale logistische Regression, die jedem Flurstück eine Wahrscheinlichkeit für Wintergetreide, Zuckerrüben oder etwas anderes gibt. Sie lernt aus den FIONA-Angaben der Betriebe (2022–2025) und den Thünen-Karten (2019–2025), und jedes Jahr wird mit einem Modell geprüft, das es nicht kannte; die Trefferquote steht mit einem 95-%-Intervall da. Kinderstuben und Rüben werden als Erwartungswert mit einem 90-%-Bereich gezählt, der einkalkuliert, dass ein ganzes Jahr das Modell auf einmal täuschen kann. GNDVI und NDRE (Red Edge, nur Sentinel-2) kommen hinzu, sobald sie heruntergeladen sind – wenn sie die Prüfung verbessern. Die festen Schwellen von vorher bleiben als Vergleichsmaßstab.
- **Bedeckung über Winter.** Ein Flurstück mit einer Sommerkultur gilt als über Winter bedeckt, wenn sein Median-HLS-NDVI im November–Dezember davor mindestens 0,5 erreicht (Zwischenfrucht); Stoppeln und gepflügter Boden bleiben darunter. Im Winter gibt es wenige wolkenfreie Bilder, oft eins bis drei je Flurstück.
- **Sommergrün und der Boden jetzt.** MODIS-NDVI Juni–August je Jahr seit 2001, neben den 5 Sommern mit der niedrigsten Wasserbilanz aus NASA POWER. Boden jetzt: das Mittel der letzten 14 Tage (SMAP Oberboden, POWER Wurzelraum) gegenüber denselben 14 Tagen in jedem früheren Jahr.
- **Nicht enthalten:** Ertrags- oder Gewinnprognosen, Schädlingsprognosen, Preise und Verträge, Maschinen.
"""

