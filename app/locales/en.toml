method_note = "For advisors and scientists: the technical details behind the plain words on the other pages."
evidence.title = "The region test: beet next to a nursery loses more leaf"
evidence.intro = "On **{n} declared beet parcel-seasons** 2023–2025, beet within 50 m of a wheat-after-beet field lost more canopy between June and late summer than beet next to other wheat – in every index and every season (NDRE −{x}, season, June value and soil held constant, p < 0.001). The decline fits a flight distance of **{r} m** best ({lo}–{hi} m) and is gone by about 200 m. Full report: `submission/planthopper_region_report.pdf`."
evidence.adjacent = "next to a nursery (< 50 m)"
evidence.control = "next to other wheat"
evidence.fig1 = "Canopy change June → late summer, by season and neighbour"
evidence.fig2 = "NDRE change by distance to the nearest nursery (season mean removed, 95 % CI)"
evidence.fig3 = "Which flight distance fits the decline best? (log-likelihood relative to the best r; dashed = 2 units)"
evidence.delta = "late summer − June"
evidence.delta_adj = "NDRE, late summer − June"
evidence.distance = "distance to the nearest wheat-after-beet field"
evidence.r = "flight distance r in e^(−distance / r), m"
evidence.llf = "fit relative to the best r"
evidence.unit = "mean per parcel of its pure 30 m pixels; one value per parcel and season"
evidence.source = "HLS S30 v2.0 (NASA LP DAAC), FIONA declarations (MLR), BK50 and NASADEM for the soil terms; pipeline/planthopper_region.py"
evidence.caveat = "An exposure–symptom association, not a diagnosis: drought and Cercospora yellow beet too, sugar content was not measured, and the control parcels are still within the adults' reach (which makes the difference smaller, not larger)."
ai = "The scores are transparent rules and a simple model – no trained model. Every number shown comes from the pipeline code and the datasets listed here. The *Ask about this field* box on the field and crop pages is a language model (any OpenAI-compatible endpoint, Qwen by default) that only puts the page's own numbers into words: it gets the page as a fact card, may not compute anything, and any figure in its answer that is not on the page is listed under the answer to check. Without a key the box is off and nothing else changes. An AI coding assistant (Claude Code) helped write the data pipeline and this app from the team's plan. The log is in `submission/si_log.md`."
method = """
- **Fields.** F1–F3 are OpenStreetMap farmland blocks of 11–17 real parcels. All values are block averages.
- **Weather numbers** (heat, frost, dry spells, downpours, water shortfall) are counted per year from daily data, separately for NASA POWER, GPM IMERG, Copernicus ERA5-Land and the nearest DWD station with data. Temperature against normal: monthly means minus the 1991–2020 mean of the same month. The thresholds are screening values and still need checking against regional sources. Evaporation (ET0) follows Hargreaves (FAO-56).
- **Crop calendar.** Sowing, emergence, canopy closure and harvest are medians of DWD crop observers within 40 km of Heilbronn (2001–2026). Soybean and field pea are not observed by DWD; their dates are literature estimates.
- **Soil score.** A daily rotation model gives each day a bareness value (like the C factor of the soil-loss equation ABAG) and weights it with downpour days (≥ 20 L/m², May–August, GPM IMERG 2001–{last}) and the field's erodibility (K) × slope factor. Each option is compared with today's rotation on the same field.
- **Water score.** Crop water use (crop coefficient × ET0, FAO-56) in the months where rain is below evaporation on this field, compared with today's rotation.
- **Planthopper, nitrogen, income** are rule scores from the literature, with the note and source on each card. Income uses no price or contract data and is always marked very rough.
- **Ranking** = Σ(your priority × score) / Σ(priority). Nothing you choose is stored.
- **Region.** Every FIONA 2022 parcel gets its crop per year 2017–2025 from the Thünen 10 m maps, and the DLR CropTypes 10 m maps (Sentinel-1 + 2, made independently) give a second opinion on every nursery; pressure on a beet parcel sums the wheat-after-beet fields around it, weighted by e^(−distance / flight distance). Checked at landscape scale, not against SBR incidence: on 3,476 declared beet parcel-seasons 2023–2025 (HLS S30, `pipeline/planthopper_region.py`), beet within 50 m of a nursery lost more canopy from June to late summer than beet next to other wheat (NDRE −0.03, NDVI −0.035; season, June value and soil held constant; standard errors clustered by 2 km cell, p < 0.001; the same sign in every index and season). A decay fit puts the best flight distance at 250–500 m. This is an exposure–symptom association: drought and Cercospora yellow beet too, and sugar loss was not measured.
- **This season from space.** Around each demo field, every clear HLS picture (Landsat 8/9 + Sentinel-2, 30 m, 2019 →) gives each parcel a mean NDVI. Its monthly medians February–October, the NDVI of the November–December before and last year's crop go into a multinomial logistic regression that gives each parcel a probability of winter cereal, sugar beet or something else. It learns from the farmers' FIONA declarations (2022–2025) and the Thünen maps (2019–2025), and every year is tested with a model that has not seen it; the accuracy comes with a 95 % interval. Nursery and beet counts are expected values with a 90 % range that allows for a whole year fooling the model at once. GNDVI and NDRE (red edge, Sentinel-2 only) join once downloaded, if they make the test better. The fixed thresholds used before are kept as the baseline it is compared with.
- **Winter cover.** A parcel that grows a spring crop is counted as covered over winter when its median HLS NDVI in the November–December before is at least 0.5 (a cover crop); stubble and ploughed land stay below. Winter has few clear pictures, often one to three per parcel.
- **Summer green and the soil now.** MODIS NDVI June–August per year since 2001, next to the 5 summers with the lowest NASA POWER water balance. Soil now: the mean of the last 14 days (SMAP topsoil, POWER root zone) against the same 14 days in every earlier year.
- **Not included:** yield or profit forecasts, pest forecasts, prices and contracts, machinery.
"""

