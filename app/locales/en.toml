# English UI catalog – the source language and the fallback for every other catalog.
# Keys are dotted paths (field.title …); placeholders are named ({n}, {place}); plurals use .one / .other.
# Translators: copy this file to <language tag>.toml (BCP 47, e.g. de.toml, fr.toml) and translate the values only.

