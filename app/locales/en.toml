**How it is worked out.** Every field outline (FIONA 2022) gets its crop for each year from the Thünen satellite crop maps. A parcel with winter wheat on last year's sugar beet is where the planthopper spends the winter. The pressure on a beet parcel adds up those parcels around it, nearer ones counting more (Σ ha × e^(−distance / flight distance)). The parcels that remove the most pressure per hectare are the ones the map marks as the senders; the received side shows the beet taking that pressure. Not checked against counts of sick beet – there are no public ones – so read it as a comparison, not a forecast. FIONA outlines are from 2022; the {season} crop map is {status}.
"""
